<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="1200" height="696" viewBox="0 0 1200 696" fill="none" role="img" aria-labelledby="title description">
  <title id="title">AI 协作宪法：优先顺序和五步裁决</title>
  <desc id="description">左边是优先顺序，七层从上到下，上面的约束下面的：平台和法律的要求；诚实，没跑的检查不写通过；委托人当前的明确决定；已采纳的成果和事实，它约束 AI，不约束委托人；本项目的规则，委托人交来或指定的规则文件；通用做法；AI 自己的判断。右边是同一层之内，最常见的是第 5 层：先分强弱，写着“建议”“尽量”“一般”这类字眼的是建议，没写的按必须对待，建议和必须撞上，建议让位，不算打架；两条都是必须的，才按五步定：委托人最新的明确决定；核实过的规定胜过没核实的描述；专门的胜过通用的；同样具体的，日期新的胜过旧的；还定不了的，两条都不执行，记进冲突登记表待委托人定，写明定之前怎么办。AI 可以按第 1 至 4 步自己定；第 5 步只能由委托人定。哪一步定了就停，写明按哪一步。</desc>
  <defs>
    <style>
      text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", "WenQuanYi Micro Hei", sans-serif; }
      .ink { fill: #1B2B3D; }
      .muted { fill: #5B6770; }
      .acc { fill: #4E3D88; }
      .head { font-size: 19px; font-weight: 600; }
      .sub { font-size: 16px; font-weight: 600; }
      .small { font-size: 15px; }
      .smallb { font-size: 15px; font-weight: 600; }
      .num { fill: #FFFFFF; font-size: 15px; font-weight: 600; }
      .card { fill: #FFFEFB; stroke: #DAD5C8; }
      .row { fill: #F5F3FA; stroke: #E1DCEE; }
      .line { stroke: #9F92C8; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="694" rx="18" fill="#F6F4EE" stroke="#E0DCD0"/>
  <path d="M40 38H70" stroke="#634E9F" stroke-width="3"/>
  <text x="81" y="43.5" class="acc smallb" letter-spacing="1.5">AI 协作宪法 v1.0</text>
  <text x="40" y="86" class="ink" font-size="28" font-weight="600">优先顺序和五步裁决</text>
  <text x="1160" y="83" class="muted" text-anchor="end" font-size="16">第 5 步只能由委托人定。</text>

  <!-- 左：优先顺序 -->
  <rect x="40" y="116" width="516" height="548" rx="10" class="card"/>
  <text x="64" y="152" class="ink head">优先顺序（上面的约束下面的）</text>
  <path d="M62 186V632.3M57 626.3L62 632.3L67 626.3" class="line"/>
  <rect x="82" y="174" width="458" height="46.4" rx="8" class="row"/>
  <circle cx="106" cy="197.2" r="13" fill="#634E9F"/>
  <text x="106" y="202.4" class="num" text-anchor="middle">1</text>
  <text x="130" y="202.8" class="ink sub">平台和法律的要求</text>
  <rect x="82" y="232.7" width="458" height="70.4" rx="8" class="row"/>
  <circle cx="106" cy="256.9" r="13" fill="#634E9F"/>
  <text x="106" y="262.1" class="num" text-anchor="middle">2</text>
  <text x="130" y="262.5" class="ink sub">诚实</text>
  <text x="130" y="285.4" class="muted small">没跑的检查不写通过</text>
  <rect x="82" y="315.3" width="458" height="46.4" rx="8" class="row"/>
  <circle cx="106" cy="338.5" r="13" fill="#634E9F"/>
  <text x="106" y="343.7" class="num" text-anchor="middle">3</text>
  <text x="130" y="344.1" class="ink sub">委托人当前的明确决定</text>
  <rect x="82" y="373.9" width="458" height="70.4" rx="8" class="row"/>
  <circle cx="106" cy="398.1" r="13" fill="#634E9F"/>
  <text x="106" y="403.3" class="num" text-anchor="middle">4</text>
  <text x="130" y="403.7" class="ink sub">已采纳的成果和事实</text>
  <text x="130" y="426.6" class="muted small">它约束 AI，不约束委托人</text>
  <rect x="82" y="456.6" width="458" height="70.4" rx="8" fill="#EEE9F7" stroke="#8F7CC4" stroke-width="1.5"/>
  <circle cx="106" cy="480.8" r="13" fill="#634E9F"/>
  <text x="106" y="486.0" class="num" text-anchor="middle">5</text>
  <text x="130" y="486.4" class="ink sub">本项目的规则</text>
  <text x="130" y="509.3" class="muted small">委托人交来或指定的规则文件</text>
  <rect x="82" y="539.2" width="458" height="46.4" rx="8" class="row"/>
  <circle cx="106" cy="562.4" r="13" fill="#634E9F"/>
  <text x="106" y="567.6" class="num" text-anchor="middle">6</text>
  <text x="130" y="568.0" class="ink sub">通用做法</text>
  <rect x="82" y="597.9" width="458" height="46.4" rx="8" class="row"/>
  <circle cx="106" cy="621.1" r="13" fill="#634E9F"/>
  <text x="106" y="626.3" class="num" text-anchor="middle">7</text>
  <text x="130" y="626.7" class="ink sub">AI 自己的判断</text>
  <path d="M540 491.8H578" stroke="#8F7CC4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M573 486.8L579 491.8L573 496.8" stroke="#8F7CC4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- 右：同一层之内 -->
  <rect x="584" y="116" width="576" height="548" rx="10" class="card"/>
  <text x="608" y="152" class="ink head">同一层之内<tspan class="muted small" font-weight="400" dx="12">最常见的是第 5 层</tspan></text>
  <rect x="608" y="170" width="528" height="148" rx="8" class="row"/>
  <text x="628" y="198" class="ink sub">先分强弱</text>
  <rect x="628" y="212" width="52" height="26" rx="13" fill="#E6E3DA"/>
  <text x="654.0" y="230.5" class="smallb" text-anchor="middle" fill="#4B5563">建议</text>
  <text x="694" y="230.5" class="muted small">写着“建议”“尽量”“一般”这类字眼的</text>
  <rect x="628" y="248" width="52" height="26" rx="13" fill="#1F2A44"/>
  <text x="654.0" y="266.5" class="smallb" text-anchor="middle" fill="#FFFFFF">必须</text>
  <text x="694" y="266.5" class="muted small">没写的按必须对待</text>
  <text x="628" y="300" class="acc smallb">建议和必须撞上，建议让位，不算打架。</text>
  <path d="M642 324V350M637 344L642 350L647 344" class="line"/>
  <text x="660" y="343" class="ink small">两条都是必须的，才按下面的顺序定</text>
  <rect x="608" y="356" width="528" height="176" rx="8" class="row"/>
  <text x="628" y="384" class="acc smallb">AI 可以按第 1 至 4 步自己定</text>
  <circle cx="642" cy="414" r="12" fill="#1F2A44"/>
  <text x="642" y="419.2" class="num" text-anchor="middle">1</text>
  <text x="666" y="419.4" class="ink smallb">委托人最新的明确决定</text>
  <circle cx="642" cy="446" r="12" fill="#1F2A44"/>
  <text x="642" y="451.2" class="num" text-anchor="middle">2</text>
  <text x="666" y="451.4" class="ink smallb">核实过的规定胜过没核实的描述</text>
  <circle cx="642" cy="478" r="12" fill="#1F2A44"/>
  <text x="642" y="483.2" class="num" text-anchor="middle">3</text>
  <text x="666" y="483.4" class="ink smallb">专门的胜过通用的</text>
  <circle cx="642" cy="510" r="12" fill="#1F2A44"/>
  <text x="642" y="515.2" class="num" text-anchor="middle">4</text>
  <text x="666" y="515.4" class="ink smallb">同样具体的，日期新的胜过旧的</text>
  <rect x="608" y="544" width="528" height="76" rx="8" fill="#EEE9F7" stroke="#8F7CC4" stroke-width="1.5"/>
  <circle cx="642" cy="572" r="12" fill="#634E9F"/>
  <text x="642" y="577.2" class="num" text-anchor="middle">5</text>
  <text x="666" y="577.6" class="ink sub">还定不了的，两条都不执行</text>
  <text x="666" y="604" class="muted small">记进冲突登记表待委托人定，写明定之前怎么办</text>
  <text x="612" y="650" class="muted small">哪一步定了就停，写明按哪一步。</text>
</svg>
